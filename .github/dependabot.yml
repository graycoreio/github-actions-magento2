version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; "/*" covers each root-level composite
    # action's action.yml (directories without one are skipped).
    directories:
      - "/"
      - "/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/resolve-check-config"
      - "/setup-install"
      - "/supported-version"
    schedule:
      interval: "weekly"
    groups:
      actions-shared:
        group-by: dependency-name
        patterns:
          - "@actions/*"
      jest-shared:
        group-by: dependency-name
        patterns:
           - "types/jest"
           - "jest"
           - "ts-jest"
    # @types/node tracks the Node runtime version, not the latest release;
    # bumping it ahead of the pinned Node version is noise.
    ignore:
      - dependency-name: "@types/node"